<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Top Dots -->
  <circle cx="26" cy="24" r="4" fill="#10b981" filter="url(#glow)" />
  <circle cx="38" cy="24" r="3" fill="#64748b" />
  <circle cx="48" cy="24" r="3" fill="#64748b" />

  <!-- CPU Bar -->
  <rect x="24" y="38" width="80" height="10" rx="5" fill="rgba(255,255,255,0.08)" />
  <rect x="24" y="38" width="56" height="10" rx="5" fill="url(#cyanGrad)" filter="url(#glow)" />

  <!-- RAM Bar -->
  <rect x="24" y="58" width="80" height="10" rx="5" fill="rgba(255,255,255,0.08)" />
  <rect x="24" y="58" width="46" height="10" rx="5" fill="url(#cyanGrad)" filter="url(#glow)" />

  <!-- NVMe SSD Bar -->
  <rect x="24" y="78" width="80" height="10" rx="5" fill="rgba(255,255,255,0.08)" />
  <rect x="24" y="78" width="76" height="10" rx="5" fill="url(#cyanGrad)" filter="url(#glow)" />

  <!-- SSD Chip Icon Accent -->
  <path d="M 40 102 L 88 102" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="64" cy="102" r="3" fill="#38bdf8" />
</svg>
