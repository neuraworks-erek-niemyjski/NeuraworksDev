[project]
name = "stat-monitor"
version = "1.0.0"
description = "Transparent glassmorphic desktop hardware stat monitor overlay for Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Erek Niemyjski", email = "erek.niemyjski@neuraworksdev.com" },
]
keywords = ["system-monitor", "nvme", "gtk", "linux", "overlay", "hardware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9.0",
    "PyGObject>=3.40.0",
]

[project.urls]
Homepage = "https://github.com/neuraworks-erek-niemyjski/stat-monitor"
Repository = "https://github.com/neuraworks-erek-niemyjski/stat-monitor"
Issues = "https://github.com/neuraworks-erek-niemyjski/stat-monitor/issues"
